<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация - Система контроля версий документов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="app-theme.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-badge" aria-hidden="true">
                <i class="fas fa-shield-alt"></i>
            </div>

            <div class="logo login-hero">
                <h1>С возвращением!</h1>
                <p>Войдите в систему контроля версий документов, чтобы продолжить работу.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Введите логин"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Введите пароль"
                            required
                        >
                    </div>
                </div>

                <div class="error-message" id="errorMessage"></div>

                <button type="submit" class="btn-primary btn-login" id="loginBtn">
                    <span id="btnText">Войти</span>
                    <span id="loadingSpinner" class="loading" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
