        /**
         * Запрашивает с сервера построчный diff двух версий и показывает результат.
         */
        async function compareDocumentVersions() {
            const documentId = document.getElementById('versionsDocumentId')?.value;
            const fromSel = document.getElementById('compareVersionFrom');
            const toSel = document.getElementById('compareVersionTo');
            if (!documentId || !fromSel || !toSel) {
                return;
            }
            const fromV = fromSel.value;
            const toV = toSel.value;
            if (!fromV || !toV || fromV === toV) {
                alert('Выберите две разные версии: старую и новую.');
                return;
            }
            
            ensureVersionDiffModal();
            const modal = document.getElementById('versionDiffModal');
            const loading = document.getElementById('versionDiffLoading');
            const errBox = document.getElementById('versionDiffError');
            const body = document.getElementById('versionDiffBody');
            const title = document.getElementById('versionDiffModalTitle');
            
            title.innerHTML = `<i class="fas fa-code-branch"></i> Сравнение v${fromV} → v${toV}`;
            errBox.style.display = 'none';
            errBox.textContent = '';
            body.innerHTML = '';
            loading.style.display = 'block';
            modal.style.display = 'flex';
            
            try {
                const url = `/api/documents/${encodeURIComponent(documentId)}/versions/compare?from=${encodeURIComponent(fromV)}&to=${encodeURIComponent(toV)}`;
                const response = await fetch(url, { credentials: 'include' });
                const data = await response.json();
                loading.style.display = 'none';
                
                if (!response.ok || !data.success) {
                    errBox.textContent = data.message || 'Не удалось выполнить сравнение';
                    errBox.style.display = 'block';
                    return;
                }
                
                const docxBadge = data.compareMode === 'docx'
                    ? ' <span class="badge text-bg-secondary align-middle" style="font-size:0.72rem;">DOCX · текст</span>'
                    : '';
                title.innerHTML = `<i class="fas fa-code-branch"></i> Сравнение v${fromV} &rarr; v${toV}${docxBadge}`;
                
                body.innerHTML = renderVersionDiffLines(data.lines);
            } catch (e) {
                console.error(e);
                loading.style.display = 'none';
                errBox.textContent = 'Ошибка сети при сравнении версий';
                errBox.style.display = 'block';
            }
        }

        /**
         * Скачивает версию: имя файла как при загрузке + _vномер (совпадает с Content-Disposition на сервере).
         */
        function downloadVersionFromBtn(btn) {
            const documentId = btn.getAttribute('data-doc');
            const versionNumber = btn.getAttribute('data-version');
            const enc = btn.getAttribute('data-dl') || '';
            let downloadFileName = '';
            try {
                downloadFileName = decodeURIComponent(enc);
            } catch (e) {
                downloadFileName = '';
            }
            const url = `/api/documents/${documentId}/versions/${versionNumber}/download`;
            const link = document.createElement('a');
            link.href = url;
            if (downloadFileName) {
                link.setAttribute('download', downloadFileName);
            }
            link.rel = 'noopener';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function previewDocument(documentId) {
            const modalId = 'documentPreviewModal';
            let modal = document.getElementById(modalId);

            if (!modal) {
                modal = createDocumentPreviewModal(modalId);
            }

            const loading = document.getElementById('documentPreviewLoading');
            const errorBox = document.getElementById('documentPreviewError');
            const content = document.getElementById('documentPreviewContent');
            const title = document.getElementById('documentPreviewTitle');
            const saveBtn = document.getElementById('savePreviewSummaryBtn');
            const currentDoc = getCurrentDocumentById(documentId);
            const documentType = currentDoc?.documentType || 'document';
            const canEditSummary = window.currentPermission === 'WRITE' || window.currentPermission === 'ADMIN';

            window.documentPreviewState = {
                documentId,
                documentType,
                canEditSummary,
                documentData: null
            };

            if (loading) loading.style.display = 'block';
            if (errorBox) {
                errorBox.style.display = 'none';
                errorBox.textContent = '';
            }
            if (content) {
                content.style.display = 'none';
                content.innerHTML = '';
            }
            if (saveBtn) {
                saveBtn.style.display = canEditSummary ? 'inline-flex' : 'none';
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'Сохранить';
            }
            if (title) {
                title.innerHTML = '<i class="fas fa-eye"></i> Просмотр документа';
            }

            modal.style.display = 'flex';

            try {
                const documentData = await loadDocumentPreviewData(documentId, documentType);
                window.documentPreviewState.documentData = documentData;

                if (title) {
                    title.innerHTML = `<i class="fas fa-eye"></i> ${escapeHtml(documentData.documentName || documentData.name || 'Просмотр документа')}`;
                }

                if (content) {
                    content.innerHTML = buildPreviewModalBody(documentData, canEditSummary);
                    content.style.display = 'block';
                }
            } catch (error) {
                console.error('Ошибка загрузки данных документа:', error);
                if (errorBox) {
                    errorBox.textContent = error.message || 'Не удалось загрузить данные документа';

                }
            } finally {
                if (loading) loading.style.display = 'none';
            }
        }

                                <button type="button" class="btn btn-secondary" id="cancelPasswordChange">Отмена</button>
                                <button type="submit" class="btn btn-primary" id="savePasswordBtn">
                                    <i class="fas fa-save"></i> Сменить пароль
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            setupPasswordModalListeners();
        }
        
        function setupPasswordModalListeners() {
            const modal = document.getElementById('passwordChangeModal');
            const closeBtn = document.getElementById('closePasswordModal');
            const cancelBtn = document.getElementById('cancelPasswordChange');
            const form = document.getElementById('changePasswordForm');
            
            if (closeBtn) {
                closeBtn.addEventListener('click', closePasswordChangeModal);
            }
            
            if (cancelBtn) {
                cancelBtn.addEventListener('click', closePasswordChangeModal);
            }
            
            if (form) {
                form.addEventListener('submit', handlePasswordChange);
            }
            
            // Закрытие по клику на оверлей
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closePasswordChangeModal();
                    }
                });
            }
        }
        
        function openPasswordChangeModal() {
            createPasswordChangeModal();
            const modal = document.getElementById('passwordChangeModal');
            if (!modal) return;
            
            // Сброс формы
            document.getElementById('changePasswordForm').reset();
            
            // Показываем модальное окно
            modal.style.display = 'flex';
        }
        
        function closePasswordChangeModal() {
            const modal = document.getElementById('passwordChangeModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }
        
        async function handlePasswordChange(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const saveBtn = document.getElementById('savePasswordBtn');
            
            // Валидация
            if (!currentPassword || !newPassword || !confirmPassword) {
                alert('Заполните все поля');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                alert('Новый пароль и подтверждение не совпадают');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Новый пароль должен содержать минимум 6 символов');
                return;
            }
            
            // Блокируем кнопку во время выполнения
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Меняем пароль...';
            saveBtn.disabled = true;
            
            try {
                const result = await changePassword(currentPassword, newPassword);
                
                if (result.success) {
                    alert(result.message || 'Пароль успешно изменен');
                    closePasswordChangeModal();
                } else {
                    alert(result.message || 'Ошибка при смене пароля');
                }
            } catch (error) {
                console.error('Ошибка при смене пароля:', error);
                alert('Ошибка при подключении к серверу');
            } finally {
                // Восстанавливаем кнопку
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            }
        }
        
        async function changePassword(currentPassword, newPassword) {
            try {
                console.log('📡 Отправляем запрос на смену пароля...');
                const response = await fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        currentPassword: currentPassword,
                        newPassword: newPassword
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                console.log('✅ Ответ на смену пароля:', data);
                return data;
                
            } catch (error) {
                console.error('❌ Ошибка смены пароля:', error);
                return {
                    success: false,
                    message: 'Ошибка подключения к серверу'
                };
            }
        }
        
        console.log('✅ Приложение инициализировано');
    </script>
</body>
</html>
