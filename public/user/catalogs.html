            } catch (error) {
                console.error('Ошибка загрузки версии:', error);
                alert('❌ Ошибка соединения с сервером');
            } finally {
                // Восстанавливаем кнопку
                uploadBtn.innerHTML = originalBtnText;
                uploadBtn.disabled = false;
            }
            
            return false;
        }
        
        /**
         * Скачивает конкретную версию документа
         */
        function downloadVersion(documentId, versionNumber, documentName) {
            const url = `/api/documents/${documentId}/versions/${versionNumber}/download`;
            const link = document.createElement('a');
            link.href = url;
            link.download = `v${versionNumber}_${documentName}`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        /**
         * Показывает модальное окно для обновления версии документа
         */
        function showUpdateModal(documentId) {
            const modalId = 'updateDocumentModal';
            let modal = document.getElementById(modalId);
            
            if (!modal) {
                modal = createUpdateModal(modalId);
            }
            
            // Устанавливаем ID документа
            document.getElementById('updateDocumentId').value = documentId;
            
            // Показать модальное окно
            modal.style.display = 'flex';
        }
        
        /**
         * Создает модальное окно для обновления документа
         */
        function createUpdateModal(modalId) {
            const modalHTML = `
                <div class="modal-overlay" id="${modalId}" style="display: none;">
                    <div class="modal-content" style="max-width: 600px;">
                        <div class="modal-header">
                            <h3><i class="fas fa-upload"></i> Обновить версию документа</h3>
                            <button class="close-btn" onclick="closeModal('${modalId}')">&times;</button>
                        </div>
                        
                        <form id="updateVersionForm">
                            <input type="hidden" id="updateDocumentId" name="documentId">
                            
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="updateVersionFile" class="form-label">Новый файл *</label>
                                    <input type="file" class="form-control" id="updateVersionFile" name="file" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="updateVersionComment" class="form-label">Комментарий к изменениям</label>
                                    <textarea class="form-control" id="updateVersionComment" name="comment" 
                                              rows="2" placeholder="Что изменилось в этой версии?"></textarea>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label">Тип хранения</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="storageType" 
                                                   id="updateStorageFull" value="full" checked>
                                            <label class="form-check-label" for="updateStorageFull">
                                                Полный файл
                                            </label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="storageType" 
                                                   id="updateStorageDelta" value="delta">
                                            <label class="form-check-label" for="updateStorageDelta">
                                                Только изменения (delta)
                                            </label>
                                        </div>
                                    </div>
                                    <small class="form-text text-muted">
                                        "Только изменения" экономит место, но требует предыдущую версию
                                    </small>
                                </div>
                            </div>
                            
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" onclick="closeModal('${modalId}')">Отмена</button>
                                <button type="button" class="btn btn-primary" id="updateVersionBtn" onclick="uploadNewVersionForUpdate('${modalId}')">
                                    <i class="fas fa-upload"></i> Загрузить новую версию
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            
            return document.getElementById(modalId);
        }
        
        /**
         * Загружает новую версию документа из модального окна обновления
         */
        async function uploadNewVersionForUpdate(modalId) {
            const documentId = document.getElementById('updateDocumentId').value;
            const form = document.getElementById('updateVersionForm');
            const formData = new FormData(form);
            const uploadBtn = document.getElementById('updateVersionBtn');
            const originalBtnText = uploadBtn.innerHTML;
            
            // Валидация
            const fileInput = document.getElementById('updateVersionFile');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Пожалуйста, выберите файл для загрузки');
                return false;
            }
            
            // Блокируем кнопку
            uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Загрузка...';
            uploadBtn.disabled = true;
            
            try {
                const response = await fetch(`/api/documents/${documentId}/versions/upload`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`✅ Версия v${data.data.versionNumber} успешно загружена!`);
                    closeModal(modalId);
                    
                    // Обновляем список документов
                    const urlParams = new URLSearchParams(window.location.search);
                    const catalogId = urlParams.get('id');
                    if (catalogId) {
                        refreshCatalog();
                    }
                } else {
                    alert(`❌ Ошибка: ${data.message || 'Не удалось загрузить версию'}`);
                }
            } catch (error) {
                console.error('Ошибка загрузки версии:', error);
                alert('❌ Ошибка соединения с сервером');
            } finally {
                // Восстанавливаем кнопку
                uploadBtn.innerHTML = originalBtnText;
                uploadBtn.disabled = false;
            }
        }
        
        /**
         * Просмотр документа (предпросмотр в модальном окне)
         */
        function previewDocument(documentId) {
            // Для простоты используем скачивание, в реальной системе можно добавить предпросмотр
            alert('Предпросмотр документа доступен после скачивания. Для просмотра скачайте документ.');
        }
        
        /**
         * Показывает информацию об отказе в доступе
         */
        function showAccessDenied(message) {
            const mainContent = document.getElementById('mainContent');
            
            mainContent.innerHTML = `
                <div class="access-denied-container">
                    <div class="access-denied-icon">
                        <i class="fas fa-ban"></i>
                    </div>
                    <h1>Доступ запрещен</h1>
                    <p class="lead">${message}</p>
                    
                    <div class="access-denied-info">
                        <h5>Возможные причины:</h5>
                        <ul>
                            <li>У вас нет прямого доступа к этому каталогу</li>
                            <li>Доступ не наследуется от родительских каталогов</li>
                            <li>Вы не являетесь администратором системы</li>
                            <li>Каталог может быть удален или заблокирован</li>
                        </ul>
                        <p class="mt-2">Обратитесь к администратору или редактору для получения доступа.</p>
                    </div>
                    
                    <div class="mt-4">
                        <button class="btn btn-primary me-2" onclick="window.location.href='/dashboard'">
                            <i class="fas fa-arrow-left me-1"></i> Вернуться на главную
                        </button>
                        <button class="btn btn-outline-secondary" onclick="window.location.reload()">
                            <i class="fas fa-redo me-1"></i> Обновить страницу
                        </button>
                    </div>
                </div>
            `;
        }
        
        /**
         * Показывает ошибку
         */
        function showError(title, message) {
            const mainContent = document.getElementById('mainContent');
            
            mainContent.innerHTML = `
                <div class="access-denied-container">
                    <div class="access-denied-icon">
                        <i class="fas fa-exclamation-triangle text-warning"></i>
                    </div>
                    <h1>${title}</h1>
                    <p class="lead">${message}</p>
                    
                    <div class="mt-4">
                        <button class="btn btn-primary" onclick="window.location.href='/dashboard'">
                            <i class="fas fa-arrow-left me-1"></i> Вернуться на главную
                        </button>
                    </div>
                </div>
            `;
        }
        
        /**
         * Функция выхода из системы
         */
        async function logout() {
            try {
                console.log('📡 Выход из системы...');
                const response = await fetch('/api/logout', { 
                    method: 'POST',
                    credentials: 'include'
                });
                
                return response.ok;
            } catch (error) {
                console.error('❌ Ошибка выхода:', error);
                return false;
            }
        }
        
        /**
         * Модальное окно для смены пароля
         */
        function createPasswordChangeModal() {
            if (document.getElementById('passwordChangeModal')) return;
            
            const modalHTML = `
                <div class="modal-overlay" id="passwordChangeModal" style="display: none;">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3><i class="fas fa-key"></i> Смена пароля</h3>
                            <button class="close-btn" id="closePasswordModal">&times;</button>
                        </div>
                        <form id="changePasswordForm">
                            <div class="modal-body">
                                <div class="form-group">
                                    <label for="currentPassword">
                                        <i class="fas fa-lock"></i> Текущий пароль *
                                    </label>
                                    <input type="password" id="currentPassword" class="form-control" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="newPassword">
                                        <i class="fas fa-lock"></i> Новый пароль *
                                    </label>
                                    <input type="password" id="newPassword" class="form-control" required>
                                    <small class="form-text">
                                        Минимум 6 символов, должен содержать буквы и цифры
                                    </small>
                                </div>
                                
                                <div class="form-group">
                                    <label for="confirmPassword">
                                        <i class="fas fa-lock"></i> Подтвердите новый пароль *
                                    </label>
                                    <input type="password" id="confirmPassword" class="form-control" required>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" id="cancelPasswordChange">Отмена</button>
                                <button type="submit" class="btn btn-primary" id="savePasswordBtn">
                                    <i class="fas fa-save"></i> Сменить пароль
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            setupPasswordModalListeners();
        }
        
        function setupPasswordModalListeners() {
            const modal = document.getElementById('passwordChangeModal');
            const closeBtn = document.getElementById('closePasswordModal');
            const cancelBtn = document.getElementById('cancelPasswordChange');
            const form = document.getElementById('changePasswordForm');
            
            if (closeBtn) {
                closeBtn.addEventListener('click', closePasswordChangeModal);
            }
            
            if (cancelBtn) {
                cancelBtn.addEventListener('click', closePasswordChangeModal);
            }
            
            if (form) {
                form.addEventListener('submit', handlePasswordChange);
            }
            
            // Закрытие по клику на оверлей
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closePasswordChangeModal();
                    }
                });
            }
        }
        
        function openPasswordChangeModal() {
            createPasswordChangeModal();
            const modal = document.getElementById('passwordChangeModal');
            if (!modal) return;
            
            // Сброс формы
            document.getElementById('changePasswordForm').reset();
            
            // Показываем модальное окно
            modal.style.display = 'flex';
        }
        
        function closePasswordChangeModal() {
            const modal = document.getElementById('passwordChangeModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }
        
        async function handlePasswordChange(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const saveBtn = document.getElementById('savePasswordBtn');
            
            // Валидация
            if (!currentPassword || !newPassword || !confirmPassword) {
                alert('Заполните все поля');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                alert('Новый пароль и подтверждение не совпадают');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Новый пароль должен содержать минимум 6 символов');
                return;
            }
            
            // Блокируем кнопку во время выполнения
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Меняем пароль...';
            saveBtn.disabled = true;
            
            try {
                const result = await changePassword(currentPassword, newPassword);
                
                if (result.success) {
                    alert(result.message || 'Пароль успешно изменен');
                    closePasswordChangeModal();
                } else {
                    alert(result.message || 'Ошибка при смене пароля');
                }
            } catch (error) {
                console.error('Ошибка при смене пароля:', error);
                alert('Ошибка при подключении к серверу');
            } finally {
                // Восстанавливаем кнопку
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            }
        }
        
        async function changePassword(currentPassword, newPassword) {
            try {
                console.log('📡 Отправляем запрос на смену пароля...');
                const response = await fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        currentPassword: currentPassword,
                        newPassword: newPassword
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                console.log('✅ Ответ на смену пароля:', data);
                return data;
                
            } catch (error) {
                console.error('❌ Ошибка смены пароля:', error);
                return {
                    success: false,
                    message: 'Ошибка подключения к серверу'
                };
            }
        }
        
        console.log('✅ Приложение инициализировано');
    </script>
</body>
</html>
