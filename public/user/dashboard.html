<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #36d1dc 0%, #5b86e5 100%);
            padding: 0 32px;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(54, 209, 220, 0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo-icon i {
            color: white;
        }

        .logo-text h1 {
            font-size: 22px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
        }

        .logo-text p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
        }

        /* User Info */
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .user-details {
            text-align: right;
        }

        .user-name {
            font-weight: 700;
            color: white;
            font-size: 15px;
            letter-spacing: -0.3px;
        }

        .user-role {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
        }

        .user-menu-dropdown {
            position: relative;
        }

        .user-menu-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            color: white;
        }

        .dropdown-content {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            min-width: 220px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 1000;
            margin-top: 12px;
            overflow: hidden;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-content a {
            color: #334155;
            padding: 14px 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .dropdown-content i {
            width: 20px;
            color: #5b86e5;
            font-size: 16px;
        }

        /* Content Area */
        .content-area {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        /* Welcome Message */
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            padding: 40px 48px;
            margin-bottom: 32px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .page-header h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .page-header p {
            font-size: 16px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .page-header.welcome-message {
            animation: fadeOut 0.5s ease forwards;
            animation-delay: 4000ms;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-30px);
                visibility: hidden;
                display: none;
            }
        }

        /* Mobile */
        .mobile-menu-btn {
            display: none;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .header-nav {
                display: none;
            }
            
            .header {
                padding: 0 20px;
                height: 70px;
            }
            
            .content-area {
                padding: 20px;
            }
            
            .page-header {
                padding: 28px;
            }
            
            .page-header h2 {
                font-size: 24px;
            }
            
            .user-details {
                display: none;
            }
            
            .logo-text p {
                display: none;
            }
            
            .logo-icon {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }
            
            .logo-text h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-file-alt"></i>
                </div>
                <div class="logo-text">
                    <h1>Документооборот</h1>
                    <p>Система контроля версий</p>
                </div>
            </div>
        </div>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">П</div>
            <div class="user-details">
                <span class="user-name" id="userName">Пользователь</span>
                <span class="user-role" id="userRole">Пользователь</span>
            </div>
            <div class="user-menu-dropdown">
                <button class="user-menu-btn" id="userMenuBtn">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-content" id="userDropdown">
                    <a href="#" id="changePasswordBtn"><i class="fas fa-key"></i> Сменить пароль</a>
                    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Выход</a>
                </div>
            </div>
        </div>
    </header>

    <div class="content-area" id="contentArea">
        <div class="page-header welcome-message" id="welcomeMessage">
            <h2>Добро пожаловать!</h2>
            <p>Управляйте документами, отслеживайте версии и работайте с корреспонденцией</p>
        </div>
        
        <div class="catalogs-container" id="catalogsContainer">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Загрузка каталогов...</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const path = window.location.pathname;
            let activePage = 'dashboard';
            
            if (path.includes('documents')) activePage = 'documents';
            if (path.includes('catalogs')) activePage = 'catalogs';
            
            const navLinks = document.querySelectorAll('.header-nav-link');
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') && link.getAttribute('href').includes(activePage)) {
                    link.classList.add('active');
                }
            });
            
            const userMenuBtn = document.getElementById('userMenuBtn');
            const userDropdown = document.getElementById('userDropdown');
            
            if (userMenuBtn && userDropdown) {
                userMenuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    userDropdown.classList.toggle('show');
                });
                
                document.addEventListener('click', (e) => {
                    if (!userMenuBtn.contains(e.target) && !userDropdown.contains(e.target)) {
                        userDropdown.classList.remove('show');
                    }
                });
            }
        });
    </script>
    
    <script src="/user/dash.js"></script>
</body>
</html>
